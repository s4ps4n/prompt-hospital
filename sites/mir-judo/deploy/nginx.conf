# TLS, редиректы http→https / www→apex и заголовки безопасности — в Traefik;
# здесь только отдача статики и Cache-Control.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;   # /catalog → /catalog/ без подстановки внутреннего host:port
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Имена ассетов без хеша — кэш на сутки с ревалидацией.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
