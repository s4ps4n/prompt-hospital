# Прод-стенд «МИР ДЗЮДО»: Traefik v3 (Let's Encrypt, HTTP-01) + nginx со статикой.
# Запуск: cd sites/mir-judo/deploy && cp .env.example .env && docker compose up -d --build
name: mir-judo

services:
  traefik:
    # ≥ v3.6: более старые не договариваются о версии API с Docker Engine 29+
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

  site:
    build:
      context: ..
      args:
        ORDER_ENDPOINT: ${ORDER_ENDPOINT:-}
        BASE_URL: https://${DOMAIN:?задайте DOMAIN в .env}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.site.loadbalancer.server.port=80
      # Основной домен
      - traefik.http.routers.site.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.site.entrypoints=websecure
      - traefik.http.routers.site.tls.certresolver=le
      - traefik.http.routers.site.middlewares=sec-headers
      # www → apex (301), сертификат выпускается и на www
      - traefik.http.routers.site-www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.site-www.entrypoints=websecure
      - traefik.http.routers.site-www.tls.certresolver=le
      - traefik.http.routers.site-www.middlewares=www-to-apex
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
      - traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.sec-headers.headers.frameDeny=true
      - traefik.http.middlewares.sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin
